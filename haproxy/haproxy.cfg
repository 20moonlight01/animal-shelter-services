global
    log stdout format raw local0
    maxconn 100
    user haproxy
    group haproxy

defaults
    log global
    mode tcp
    option tcplog
    retries 3
    timeout connect 10s
    timeout client 1h
    timeout server 1h

backend postgres_servers
    mode tcp
    balance roundrobin
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions

    server patroni-node1 patroni-node1:5432 check port 8008
    server patroni-node2 patroni-node2:5432 check port 8008

frontend postgres_frontend
    bind *:5432
    mode tcp
    default_backend postgres_servers

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:${HAPROXY_STATS_PASSWORD:-admin}
    stats refresh 10s

    http-request use-service prometheus-exporter if { path /metrics }

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'backup-exporter'
    static_configs:
      - targets: ['backup-exporter:8080']

  - job_name: 'patroni-nodes'
    static_configs:
      - targets: ['patroni-node1:8008', 'patroni-node2:8008']

  - job_name: 'etcd'
    static_configs:
      - targets: ['etcd:2379']

  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:8404']